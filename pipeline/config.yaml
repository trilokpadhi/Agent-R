# Agent-R reproduction: Qwen3.5-9B on WebShop + SciWorld, 3 iterations.
# Every setting the pipeline uses lives here. Each value names its source.
# Each launch records its commit and this file in /data/runs/<run>/run.json; every step's .done names its commit.

run: q35ws                     # short id; child Job names are agr-<run>-i<iter>-<step>-<shard>
tasks: [webshop]              # user (Sep 14): finish WebShop end to end (3 iterations), then run SciWorld separately
namespace: ii400r87
pvc: tpadhi1
gpus: 7                        # user decision (only 7 H100s are available to the namespace)
iterations: 3                  # paper: "we conduct Agent-R for three iterations"
seed: 42
run_root: /data/runs           # outputs: /data/runs/<run>/iter<N>/<step>

images:                        # pinned by digest; verified on this cluster (Sep 14)
  vllm: vllm/vllm-openai:qwen3_5@sha256:4df38f8d5ea7c286b6ad6725361c0e1d159ad36b6a2f951bc5e00467cfc4e9ae
  sft: modelscope-registry.us-west-1.cr.aliyuncs.com/modelscope-repo/modelscope@sha256:cb8aadb783de32cd9df894b0d44b96161b31bed78d1eeafd59e9563a518743c3  # ms-swift 4.5.3, transformers 5.16.1
  env_server: condaforge/miniforge3:24.3.0-0
  controller: alpine/k8s@sha256:5efac3ed9955c8747296d520539cded681f4ef5dbb73fb591141df282b61cc35  # 1.32.13, matches the cluster

node_selector_key: nvidia.com/gpu.product
node_selector_value: NVIDIA-H100-80GB-HBM3

model:
  name: Qwen3.5-9B
  base_dir: /data/models/huggingface/hub/models--Qwen--Qwen3.5-9B/snapshots/c202236235762e1c871ad0ccb60c8ee5ba337b9a

environments:                  # prebuilt on the PVC; SciWorld uses the maintainers' AgentGym files (issues #5, #8)
  webshop:
    agentenv: /data/src/AgentGym/agentenv
  sciworld:
    agentenv: /data/src/AgentGym-agentr/agentenv

inference:                     # shared by search and revision (eval overrides temp below)
  temp: 1                      # paper: expansion temperature 1; also the code's default TEMP (llm_server.py)
  max_new_tokens: 500          # upstream llm_server.py max_tokens=500
  max_token_length: 8192       # maintainer, issue #8
  enable_thinking: 0           # Agent-R's base model (Llama-3.1) has no thinking mode
  vllm_dtype: bfloat16
  # vLLM max model length is not set: vLLM uses the model's own context length. It only caps a single
  # request and does not change results; path_collection.py truncates by words, so prompts can exceed 8192 tokens.
  # Processes per GPU are not a setting: one mcts_collection.py per task id and one path_collection.py per tree,
  # all sharing that GPU's vLLM server. Speed only; results do not depend on it.

search:                        # mcts_collection.py, released code as-is: same tasks every iteration
  max_depth: 20                # paper
  itera: 8                     # paper / maintainer issue #3
  n_gen: 4                     # paper
  webshop_tasks: 300           # paper: 300 WebShop simulations; ids from the code's range(1000)
  sciworld_task_iteration: 9   # 23 tasks x 9 variations ~= the paper's 200 SciWorld simulations
  seed_trees:                  # already-collected iteration-1 WebShop trees (same model, same settings)
    iter1:
      webshop: /data/runs/q35v1/iter1/search-webshop/mcts_result/webshop/Qwen3.5-9B   # 300 trees
      # SciWorld run later: /data/runs/q35v1/iter1/search-sciworld/mcts_result/sciworld/Qwen3.5-9B (207 trees)

revise:                        # path_collection.py --data_type centric --revise 1 (README)
  alpha: [0.5, 0.7, 1.0]       # paper, per iteration; applied to raw scores as the code does (SciWorld 0-100)
  beta: 0.2                    # paper

sft_data:
  # Maintainer (issue #8): each iteration trains on revise_log + high_log entries; paper Table 1 sizes.
  # Rows above a cap are sampled down with the run seed; rows below it are all used.
  caps:
    webshop: {revise: 5500, good: 600}
    sciworld: {revise: 8000, good: 2500}
  general_path: /data/datasets/sharegpt/ShareGPT_V3_unfiltered_cleaned_split.json  # ShareGPT_Vicuna_unfiltered
  general_fraction: 0.25       # maintainer: (revision + good) : general = 8 : 2

sft:                           # paper appendix C.1 (Llama-3.1-8B), mapped to ms-swift
  epochs: [3, 1, 1]            # paper
  continue_from_previous: true # user decision: iterations 2-3 fine-tune the previous checkpoint
  max_length: 8196             # paper C.1: "a sequence length of 8,196"
  truncation_strategy: right   # XTuner truncates; ms-swift's default 'delete' would drop long samples
  learning_rate: 2.0e-5        # paper C.1
  warmup_ratio: 0.03           # paper C.1: 3% warm-up, cosine scheduler
  weight_decay: 0              # paper C.1: AdamW, weight decay 0
  max_grad_norm: 1             # paper C.1
  adam_beta1: 0.9              # XTuner
  adam_beta2: 0.999            # XTuner
  dtype: bfloat16              # user decision (XTuner uses fp16)
  global_batch: 112            # paper C.1: batch 1 per device x accumulation 16, on our 7 GPUs (paper: 8 A100-80GB)
  per_device_batch: 1          # paper C.1
  deepspeed: zero2             # Agent-R README: --deepspeed deepspeed_zero2
  packing: false               # required: Qwen3.5 linear attention does not support packing
  loss_scale: default          # all assistant turns get loss, as in the released code (user decision)

eval:                          # eval.py
  temp: 0                      # paper C.1: "Following the settings in AgentGym, the evaluation temperature is set to 0"
  max_steps: 100               # paper: up to 100 rounds
  task_limit: 0                # 0 = full 200-item test sets
