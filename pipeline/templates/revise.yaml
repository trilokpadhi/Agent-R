# Step: build revision data (path_collection.py --data_type centric --revise 1), one GPU.
# The current model (served by vLLM) finds the first wrong step in each bad path.
# Output goes to a temporary directory and is moved into place only on success, because
# path_collection.py appends to its JSONL and a rerun would otherwise duplicate rows.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{JOB_NAME}}
  labels: {project: agent-r, pipeline-run: "{{RUN}}", step: revise}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {project: agent-r, pipeline-run: "{{RUN}}", step: revise}
    spec:
      restartPolicy: Never
      nodeSelector:
        {{NODE_KEY}}: {{NODE_VALUE}}
      containers:
        - name: policy
          image: {{IMAGE_VLLM}}
          env:
{{COMMON_ENV}}
            - {name: ALPHA, value: "{{ALPHA}}"}
            - {name: BETA, value: "{{BETA}}"}
            - {name: INPUT_DIR, value: "{{INPUT_DIR}}"}
          command: ["bash", "-c"]
          args:
            - |
              set -uo pipefail
              rm -f /etc/ld.so.conf.d/cuda-compat.conf && ldconfig
{{START_VLLM}}
              mkdir -p "$WORKDIR/out" && cd "$WORKDIR" && ln -sfn "$CODE/mcts_utils" mcts_utils
              TREES=$(ls "$INPUT_DIR" | wc -l)
              echo "REVISE_START $(date -Is) $TASK trees=$TREES processes=$WORKERS alpha=$ALPHA beta=$BETA model=$MODEL_DIR"
              # One path_collection.py per tree, $WORKERS at a time, all sharing this GPU's vLLM server.
              # A tree's output moves into out/ only when it finishes, so a restart skips finished trees
              # (path_collection.py appends to its JSONL, so partial output must never be reused).
              ls "$INPUT_DIR" | xargs -P "$WORKERS" -n 1 bash -c '
                t="$1"
                [ -d "out/$t" ] && exit 0
                rm -rf "partial/$t"
                python3 "$CODE/path_collection.py" --input_dir "$INPUT_DIR/$t" --output_dir "partial/$t" \
                  --data_type centric --revise 1 >> "$LOG_DIR/$JOB_NAME.$t.log" 2>&1 \
                  && mkdir -p "partial/$t" && mv "partial/$t" "out/$t"' _
              RC=$?
              kill "$VLLM_PID" 2>/dev/null
              DONE=$(ls out | wc -l)
              [ "$RC" -eq 0 ] && [ "$DONE" -eq "$TREES" ] || { echo "REVISE_FAILED rc=$RC trees_done=$DONE/$TREES; see $LOG_DIR/$JOB_NAME.*.log"; exit 1; }
              echo "REVISE_DONE $(date -Is) trees=$DONE rows=$(cat out/*/*.jsonl 2>/dev/null | wc -l)"
          resources:
            limits: {nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{PVC}}}
