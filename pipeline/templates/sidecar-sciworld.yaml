        - name: env-server
          image: {{IMAGE_ENV_SERVER}}
          restartPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              set -e
              source /opt/conda/etc/profile.d/conda.sh
              conda activate /data/envs/agentenv-sciworld
              if [ "{{SCIWORLD_PROTOCOL}}" = "eto" ]; then
                # Co-Evolving's ScienceWorld: simplificationStr="easy", reward = raw_score (0-1)
                # kept as the episode maximum, (task_name, variation_idx) from their split files,
                # per-task step budgets. Scoring is their own monkey patch, imported not reimplemented.
                # SCIWORLD_SPLIT selects the column: train for search, dev = Seen, test = Unseen.
                export PYTHONPATH=/data/src/sciworld-eto:/data/src/agentr-pipeline/{{SHA}}
                export SCIWORLD_ETO_ROOT=/data/src/sciworld-eto
                export SCIWORLD_SPLIT="{{SCIWORLD_SPLIT}}"
                cd /data/src/sciworld-eto
                # Serve ports 36001..36001+N-1: search.yaml sends worker w to 36001 + w % ENV_SERVERS,
                # so serving fewer ports than that makes workers fail with connection refused.
                for i in $(seq 0 $(( {{ENV_SERVERS}} - 1 ))); do
                  ( export HOST=127.0.0.1 PORT=$((36001 + i))
                    exec python /data/src/agentr-pipeline/{{SHA}}/sciworld_eto/server.py ) &
                done
                wait
              else
                # AgentGym with the Agent-R maintainers' SciWorld files (issues #5 and #8):
                # no simplification, reward 0-100, flat data_idx over all 4,639 (task, variation) pairs.
                cd /data/src/AgentGym-agentr/agentenv-sciworld
                exec python -c "import uvicorn; uvicorn.run('agentenv_sciworld:app', host='127.0.0.1', port=36001)"
              fi
          startupProbe:
            exec:
              command: ["/data/envs/agentenv-sciworld/bin/python", "-c", "import urllib.request; [urllib.request.urlopen(f'http://127.0.0.1:{36001+i}/', timeout=3) for i in range({{ENV_SERVERS}})]"]
            periodSeconds: 10
            timeoutSeconds: 5
            # ScienceWorld starts a JVM per session; allow headroom for the first load.
            failureThreshold: 120
          resources:
            requests: {memory: 8Gi}
            limits: {memory: 48Gi}
          volumeMounts:
            - name: data
              mountPath: /data
