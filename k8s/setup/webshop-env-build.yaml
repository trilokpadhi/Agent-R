# CPU-only Job: build the AgentGym WebShop server environment onto the PVC, then
# start the server once and check that it answers.
#   conda env -> /data/envs/agentenv-webshop  (Python 3.8, faiss-cpu 1.7, OpenJDK 11)
#   indexes   -> /data/src/AgentGym/agentenv-webshop/webshop/search_engine/indexes*
#   log       -> /data/logs/webshop-env-build-002.log
# Later Jobs can run the server from the same image with:
#   source /opt/conda/etc/profile.d/conda.sh && conda activate /data/envs/agentenv-webshop
#   cd /data/src/AgentGym/agentenv-webshop/webshop && webshop --host 127.0.0.1 --port 36001
# Apply: kubectl apply -n ii400r87 -f k8s/webshop-env-build.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: webshop-env-build-002
  labels:
    project: agent-r
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        project: agent-r
    spec:
      restartPolicy: Never
      containers:
        - name: build
          image: condaforge/miniforge3:24.3.0-0
          env:
            - name: ENV_PREFIX
              value: /data/envs/agentenv-webshop
            - name: SRC
              value: /data/src/AgentGym/agentenv-webshop
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: PIP_YES            # setup.sh runs `pip uninstall numpy` without -y
              value: "1"
          command: ["bash", "-c"]
          args:
            - |
              set -eo pipefail
              mkdir -p /data/envs /data/logs
              exec > >(tee -a /data/logs/webshop-env-build-002.log) 2>&1
              echo "START $(date -Is) on $(hostname)"

              if [ ! -x "$ENV_PREFIX/bin/python" ]; then
                conda create -y -p "$ENV_PREFIX" --override-channels -c conda-forge \
                  python=3.8 faiss-cpu=1.7 openjdk=11 c-compiler cxx-compiler
              fi
              source /opt/conda/etc/profile.d/conda.sh
              conda activate "$ENV_PREFIX"
              python --version
              java -version

              cd "$SRC"
              if [ -x "$ENV_PREFIX/bin/webshop" ] && [ -n "$(ls -A "$SRC/webshop/search_engine/indexes" 2>/dev/null)" ]; then
                echo "setup.sh already completed (webshop CLI and indexes present); skipping"
              else
                bash ./setup.sh
              fi
              # setup.sh pins typing_extensions<4.6.0, but its final `pip install -e .`
              # upgrades it (4.13.2 in run 001), which breaks spaCy 3.3 / pydantic 1.x with
              # "issubclass() arg 1 must be a class". 4.5.0 also satisfies fastapi 0.103.2.
              pip install "typing_extensions==4.5.0"
              pip list 2>/dev/null | grep -i -E "^(typing.extensions|pydantic|spacy|fastapi|starlette|numpy|torch|pyserini|gym) "
              pip check || true

              echo "== verify install"
              command -v webshop
              for d in indexes indexes_100 indexes_1k indexes_100k; do
                p="$SRC/webshop/search_engine/$d"
                if [ -z "$(ls -A "$p" 2>/dev/null)" ]; then echo "MISSING_OR_EMPTY_INDEX: $p"; exit 1; fi
                echo "index ok: $p ($(du -sh "$p" | cut -f1))"
              done
              python -c "import spacy; spacy.load('en_core_web_lg'); print('spacy en_core_web_lg ok')"
              python -c "import pyserini, faiss, gym, torch; print('pyserini/faiss/gym/torch import ok', torch.__version__)"

              echo "== server self-test"
              cd "$SRC/webshop"
              webshop --host 127.0.0.1 --port 36001 > /data/logs/webshop-server-selftest-002.log 2>&1 &
              SERVER_PID=$!
              python - <<'EOF'
              import json, sys, time, urllib.request
              base = "http://127.0.0.1:36001"
              def call(method, path, timeout=900):
                  req = urllib.request.Request(base + path, data=b"" if method == "POST" else None, method=method)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.read().decode()
              for _ in range(180):
                  try:
                      print("GET / ->", call("GET", "/", timeout=5)); break
                  except Exception:
                      time.sleep(5)
              else:
                  sys.exit("WEBSHOP_SERVER_DID_NOT_START")
              t = time.time()
              env_idx = int(json.loads(call("POST", "/create")))
              print(f"POST /create -> {env_idx} ({time.time() - t:.0f}s)")
              obs = call("GET", f"/observation?env_idx={env_idx}")
              print("GET /observation ->", obs[:400])
              print("WEBSHOP_SERVER_SELFTEST_PASSED")
              EOF
              kill "$SERVER_PID" || true
              echo "END $(date -Is)"
              echo WEBSHOP_ENV_BUILD_DONE
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tpadhi1
