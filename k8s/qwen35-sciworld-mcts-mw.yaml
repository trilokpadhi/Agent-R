# One-H100 Job: Agent-R MCTS trajectory collection for Qwen3.5-9B on SciWorld, iteration 1,
# with the paper's settings: ITERA=8 rollouts, MAX_DEPTH=20, N_GEN=4 candidates, c_uct=0.25,
# TEMP=1 for expansion, MAX_TOKEN_LENGTH=8192.
#
# Sharding: mcts_collection.py loops over task_nums[SHARD_MIN:SHARD_MAX] of the maintainer split
# [1, 2, 3, 4, 5, 6, 7, 8, 9, 12, 13, 17, 18, 19, 20, 21, 22, 25, 26, 27, 28, 29, 0] and, for each
# task, over variations k = 1..TASK_ITERATION of get_game_nums() task_inds (index 0 is skipped,
# stops early if a task has fewer variations). 23 tasks x TASK_ITERATION=9 gives about 200
# simulations. Finished ids are skipped on resubmission.
# The SciWorld server and client come from /data/src/AgentGym-agentr (maintainer AgentGym files).
#
# Output: /data/results/mcts-iter1-sciworld/mcts_result/sciworld/Qwen3.5-9B/search_results_<data_idx>.json
# Apply: kubectl apply -n ii400r87 -f k8s/qwen35-sciworld-mcts.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen35-sciworld-mcts-it1-s000
  labels:
    project: agent-r
    stage: mcts-iter1
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        project: agent-r
        stage: mcts-iter1
    spec:
      restartPolicy: Never
      initContainers:
        - name: sciworld-server
          image: condaforge/miniforge3:24.3.0-0
          restartPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              set -e
              source /opt/conda/etc/profile.d/conda.sh
              conda activate /data/envs/agentenv-sciworld
              cd /data/src/AgentGym-agentr/agentenv-sciworld
              python -c "import importlib.util, sys; o = importlib.util.find_spec('agentenv_sciworld').origin; print('agentenv_sciworld from', o); sys.exit(0 if o.startswith('/data/src/AgentGym-agentr/') else 1)"
              exec python -c "import uvicorn; uvicorn.run('agentenv_sciworld:app', host='127.0.0.1', port=36001)"
          startupProbe:
            exec:
              command:
                - /data/envs/agentenv-sciworld/bin/python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:36001/', timeout=3)"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: policy
          image: vllm/vllm-openai:qwen3_5@sha256:4df38f8d5ea7c286b6ad6725361c0e1d159ad36b6a2f951bc5e00467cfc4e9ae
          env:
            - name: JOB_NAME
              value: qwen35-sciworld-mcts-it1-s000
            - name: SHARD_MIN
              value: "0"
            - name: SHARD_MAX
              value: "1"
            # Workers share the pod's one GPU and one env server; each worker runs its own
            # vLLM instance with GPU_FRAC of GPU memory (9B bf16 weights are ~17.7 GB).
            - name: WORKERS
              value: "3"
            - name: GPU_FRAC
              value: "0.30"
            - name: TASK_ITERATION
              value: "2"
            - name: HF_HOME
              value: /data/models/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: PYTHONPATH
              value: /data/src/Agent-R:/data/src/AgentGym-agentr/agentenv:/data/envs/policy-site
            - name: MODEL_DIR
              value: /data/models/huggingface/hub/models--Qwen--Qwen3.5-9B/snapshots/c202236235762e1c871ad0ccb60c8ee5ba337b9a
            - name: MODEL_NAME
              value: Qwen3.5-9B
            - name: MODEL_TYPE
              value: Raw
            - name: TASK
              value: sciworld
            - name: MAX_DEPTH
              value: "20"
            - name: ITERA
              value: "8"
            - name: N_GEN
              value: "4"
            - name: TEMP
              value: "1"
            - name: MAX_TOKEN_LENGTH
              value: "8192"
            - name: MAX_NEW_TOKENS
              value: "500"
            - name: VLLM_DTYPE
              value: bfloat16
            - name: VLLM_MAX_MODEL_LEN
              value: "16384"
            - name: STOP_TOKENS
              value: ""
            - name: ENABLE_THINKING
              value: "0"
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              rm -f /etc/ld.so.conf.d/cuda-compat.conf
              ldconfig
              nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
              python3 -c "import urllib.request; print('sciworld server:', urllib.request.urlopen('http://127.0.0.1:36001/', timeout=5).read().decode())"

              RUN_DIR=/data/results/mcts-iter1-sciworld
              mkdir -p "$RUN_DIR" /data/logs
              cd "$RUN_DIR"
              ln -sfn /data/src/Agent-R/mcts_utils mcts_utils
              echo "START $(date -Is) task_nums[$SHARD_MIN:$SHARD_MAX] task_iteration=$TASK_ITERATION in $RUN_DIR"

              echo "workers=$WORKERS gpu_frac=$GPU_FRAC over shard [$SHARD_MIN, $SHARD_MAX)"
              span=$(( (SHARD_MAX - SHARD_MIN + WORKERS - 1) / WORKERS ))
              pids=""
              for i in $(seq 0 $((WORKERS - 1))); do
                lo=$(( SHARD_MIN + i * span ))
                hi=$(( lo + span ))
                [ "$hi" -gt "$SHARD_MAX" ] && hi=$SHARD_MAX
                [ "$lo" -ge "$hi" ] && continue
                echo "worker $i: [$lo, $hi)"
                VLLM_GPU_MEMORY_UTILIZATION="$GPU_FRAC" python3 /data/src/Agent-R/mcts_collection.py \
                  --env_server_base http://127.0.0.1:36001 \
                  --model_name "$MODEL_NAME" \
                  --min "$lo" --max "$hi" --task_iteration "$TASK_ITERATION" > "/data/logs/$JOB_NAME-w$i.log" 2>&1 &
                pids="$pids $!"
              done
              rc=0
              for p in $pids; do wait "$p" || rc=1; done
              for f in /data/logs/$JOB_NAME-w*.log; do echo "== tail $f"; tail -5 "$f"; done
              [ "$rc" -eq 0 ] || { echo "a worker failed"; exit 1; }

              echo "== results"
              python3 - <<'EOF'
              import glob, json, os

              def walk(node, depth=0):
                  children = node.get("children") or []
                  stats = [(depth, node.get("env_score", 0))]
                  for child in children:
                      stats += walk(child, depth + 1)
                  return stats

              out_dir = f"mcts_result/{os.environ['TASK']}/{os.environ['MODEL_NAME']}"
              files = sorted(glob.glob(f"{out_dir}/search_results_*.json"), key=os.path.getmtime)
              print("result files in shared dir:", len(files))
              for path in files[-10:]:
                  root = json.load(open(path))
                  stats = walk(root)
                  print(f"{os.path.basename(path)}: nodes={len(stats)} max_depth={max(d for d, _ in stats)} "
                        f"max_env_score={max(s for _, s in stats)} root_value={root.get('value')} root_visits={root.get('visits')} "
                        f"size={os.path.getsize(path) // 1024}KB")
              EOF
              echo "END $(date -Is)"
              echo QWEN_SCIWORLD_MCTS_DONE
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tpadhi1
